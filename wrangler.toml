name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "e5b93164-8164-496e-aa00-42567549eb9b"
database_name = "memos-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "389ab8efe77643b1a51f30e10e9e797f"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "memos-r2"
preview_bucket_name = "memos-files-preview"
